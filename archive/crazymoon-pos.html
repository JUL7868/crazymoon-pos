<!-- FILE: crazymoon-pos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crazy Moon POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0f0f0d;
      --panel:    #1a1916;
      --card:     #232220;
      --hover:    #2c2b28;
      --orange:   #e8832a;
      --orange-d: #c46e1f;
      --gold:     #f5c842;
      --text-hi:  #f0ede6;
      --text-mid: #a09a8e;
      --text-lo:  #5a5650;
      --border:   rgba(255,255,255,0.07);
      --border-m: rgba(255,255,255,0.13);
      --success:  #4a9e5c;
      --red:      #d44a4a;
      --radius:   8px;
      --radius-lg:12px;
      --font-h:   'Oswald', sans-serif;
      --font-b:   'Barlow', sans-serif;
    }
    body { font-family: var(--font-b); background: var(--bg); color: var(--text-hi); height: 100vh; overflow: hidden; }
    .pos { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }

    .left { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }

    .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .logo { font-family: var(--font-h); font-size: 15px; font-weight: 600; letter-spacing: 0.05em; flex: 1; }
    .logo span { color: var(--orange); }

    .tab-btn { padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 12px; color: var(--text-mid); font-family: var(--font-b); transition: all 0.15s; }
    .tab-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); font-weight: 500; }
    .tab-btn:hover:not(.active) { background: var(--hover); color: var(--text-hi); }
    .tab-btn.has-order { border-color: var(--success); color: var(--success); }
    .tab-btn.has-order.active { background: var(--success); color: #fff; border-color: var(--success); }

    .new-tab-btn { padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--orange); background: transparent; cursor: pointer; font-size: 12px; color: var(--orange); font-family: var(--font-b); white-space: nowrap; font-weight: 500; transition: all 0.15s; }
    .new-tab-btn:hover { background: var(--orange); color: #fff; }

    .cat-bar { display: flex; gap: 5px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--panel); overflow-x: auto; }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 12px; white-space: nowrap; color: var(--text-mid); font-family: var(--font-b); flex-shrink: 0; transition: all 0.12s; }
    .cat-btn.active { background: var(--text-hi); color: var(--bg); border-color: var(--text-hi); }
    .cat-btn:hover:not(.active) { background: var(--hover); color: var(--text-hi); }

    .sampler-note { padding: 4px 14px 5px; font-size: 10px; color: var(--text-lo); border-bottom: 1px solid var(--border); background: var(--panel); }
    .sampler-note span { color: var(--orange); }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 7px; padding: 10px 14px; overflow-y: auto; flex: 1; align-content: start; background: var(--bg); }
    .menu-grid::-webkit-scrollbar { width: 3px; }
    .menu-grid::-webkit-scrollbar-thumb { background: var(--border-m); border-radius: 2px; }

    .menu-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 10px; cursor: pointer; transition: border-color 0.12s, transform 0.1s; -webkit-tap-highlight-color: transparent; }
    .menu-item:hover { border-color: var(--orange); transform: translateY(-1px); }
    .menu-item:active { transform: scale(0.97); }

    .item-badge { display: inline-block; font-size: 9px; padding: 2px 5px; border-radius: 999px; margin-bottom: 5px; font-weight: 600; font-family: var(--font-h); }
    .b-tap     { background: #1a2e40; color: #5ab4f0; border: 1px solid #2a4a60; }
    .b-lata    { background: #1a2e1e; color: #5abf72; border: 1px solid #2a4a30; }
    .b-pizza   { background: #3a1f0a; color: var(--orange); border: 1px solid #5a3015; }
    .b-burger  { background: #3a150a; color: #f07050; border: 1px solid #5a2515; }
    .b-food    { background: #2a1a3a; color: #a07adf; border: 1px solid #3a2a5a; }
    .b-postre  { background: #3a1a2a; color: #e070a0; border: 1px solid #5a2a40; }
    .b-bebida  { background: #0a2a2a; color: #50c0c0; border: 1px solid #155a5a; }

    .item-name  { font-size: 12px; font-weight: 500; line-height: 1.3; margin-bottom: 3px; color: var(--text-hi); }
    .item-sub   { font-size: 10px; color: var(--text-lo); margin-bottom: 6px; line-height: 1.3; }
    .item-price { font-size: 13px; font-weight: 600; color: var(--orange); font-family: var(--font-h); }

    .right { display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }

    .order-header { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .order-title { font-size: 14px; font-weight: 600; font-family: var(--font-h); letter-spacing: 0.04em; }
    .order-sub   { font-size: 11px; color: var(--text-mid); margin-top: 2px; }

    .order-items { flex: 1; overflow-y: auto; padding: 8px 14px; }
    .order-items::-webkit-scrollbar { width: 3px; }
    .order-items::-webkit-scrollbar-thumb { background: var(--border-m); border-radius: 2px; }
    .order-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-lo); font-size: 13px; }

    .order-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .order-row:last-child { border-bottom: none; }
    .order-row-name { flex: 1; font-size: 12px; font-weight: 500; color: var(--text-hi); }
    .order-row-name span { display: block; font-size: 10px; color: var(--text-lo); font-weight: 400; }
    .order-row-name .order-note { color: var(--orange); }
    .qty-btn { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; color: var(--text-mid); font-family: var(--font-b); transition: all 0.12s; }
    .qty-btn:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
    .qty-num { font-size: 12px; font-weight: 600; min-width: 16px; text-align: center; }
    .order-row-price { font-size: 12px; font-weight: 600; min-width: 48px; text-align: right; color: var(--orange); font-family: var(--font-h); }
    .remove-btn { background: none; border: none; cursor: pointer; color: var(--text-lo); font-size: 13px; padding: 2px; transition: color 0.12s; }
    .remove-btn:hover { color: var(--red); }

    .totals { padding: 8px 14px; border-top: 1px solid var(--border); background: var(--bg); }
    .totals-row.grand { display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; font-family: var(--font-h); letter-spacing: 0.03em; }
    .totals-row.grand span:last-child { color: var(--orange); }

    .pay-section { padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 7px; background: var(--bg); border-top: 1px solid var(--border); }
    .pay-method { display: flex; gap: 5px; }
    .pay-method button { flex: 1; padding: 7px; border-radius: var(--radius); border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 12px; font-family: var(--font-b); color: var(--text-mid); transition: all 0.12s; font-weight: 500; }
    .pay-method button.sel { background: var(--success); color: #fff; border-color: var(--success); }
    .pay-method button:hover:not(.sel) { background: var(--hover); color: var(--text-hi); }

    .cash-row { display: flex; gap: 6px; align-items: center; }
    .cash-row label { font-size: 11px; color: var(--text-mid); white-space: nowrap; }
    .cash-row input { flex: 1; padding: 6px 8px; border-radius: var(--radius); border: 1px solid var(--border-m); background: var(--card); color: var(--text-hi); font-size: 13px; font-family: var(--font-b); }
    .cash-row input:focus { outline: none; border-color: var(--orange); }
    .change-display { font-size: 12px; font-weight: 600; color: var(--success); white-space: nowrap; }

    .charge-btn { width: 100%; padding: 12px; border-radius: var(--radius); background: var(--orange); color: #fff; border: none; cursor: pointer; font-size: 14px; font-weight: 600; font-family: var(--font-h); letter-spacing: 0.06em; text-transform: uppercase; transition: background 0.15s, opacity 0.15s; }
    .charge-btn:hover:not(:disabled) { background: var(--orange-d); }
    .charge-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .clear-btn { width: 100%; padding: 6px; border-radius: var(--radius); border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 12px; font-family: var(--font-b); color: var(--text-mid); transition: all 0.12s; }
    .clear-btn:hover { background: var(--hover); color: var(--text-hi); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card); border-radius: var(--radius-lg); padding: 20px; width: 340px; border: 1px solid var(--border-m); }
    .modal h2 { font-size: 15px; font-weight: 600; font-family: var(--font-h); letter-spacing: 0.04em; margin-bottom: 14px; }
    .table-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .table-opt { padding: 12px 6px; border-radius: var(--radius); border: 1px solid var(--border-m); background: var(--panel); cursor: pointer; text-align: center; font-size: 12px; font-weight: 500; color: var(--text-mid); transition: all 0.12s; -webkit-tap-highlight-color: transparent; }
    .table-opt:hover { border-color: var(--orange); color: var(--orange); }
    .table-opt.occupied { border-color: var(--success); color: var(--success); }
    .table-opt.vip { border-color: var(--gold); color: var(--gold); }
    .modal-cancel { width: 100%; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border-m); background: transparent; cursor: pointer; font-size: 13px; font-family: var(--font-b); color: var(--text-mid); }
    .modal-cancel:hover { background: var(--hover); }

    .size-modal-btns { display: flex; gap: 8px; }
    .size-btn-sm { flex: 1; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border-m); background: var(--panel); cursor: pointer; font-family: var(--font-h); font-size: 13px; color: var(--text-mid); transition: all 0.12s; letter-spacing: 0.03em; }
    .size-btn-sm:hover { border-color: var(--orange); color: var(--orange); }
    .size-btn-lg { flex: 1; padding: 12px; border-radius: var(--radius); border: none; background: var(--orange); cursor: pointer; font-family: var(--font-h); font-size: 13px; color: #fff; font-weight: 600; transition: all 0.12s; }
    .size-btn-lg:hover { background: var(--orange-d); }

    .note-input {
      width: 100%;
      min-height: 80px;
      background: var(--panel);
      border: 1px solid var(--border-m);
      border-radius: var(--radius);
      color: var(--text-hi);
      padding: 10px;
      font-family: var(--font-b);
      font-size: 13px;
      resize: none;
    }
    .note-input:focus {
      outline: none;
      border-color: var(--orange);
    }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--orange); color: #fff; padding: 9px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap; font-family: var(--font-b); }
    .toast.show { opacity: 1; }

    .spinner-overlay { position: fixed; inset: 0; background: rgba(15,15,13,0.6); display: flex; align-items: center; justify-content: center; z-index: 300; display: none; }
    .spinner-overlay.show { display: flex; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border-m); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .pos {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }

      .left {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .right {
        height: auto;
      }

      body {
        overflow: auto;
      }
    }

    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        padding: 8px;
      }

      .menu-item {
        padding: 8px;
      }

      .item-name {
        font-size: 11px;
      }

      .item-price {
        font-size: 12px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      #tab-list {
        width: 100%;
        overflow-x: auto;
      }

      .tab-btn {
        font-size: 11px;
        padding: 4px 8px;
      }

      .cat-bar {
        padding: 6px 10px;
      }

      .order-items {
        max-height: 300px;
      }

      .totals-row.grand {
        font-size: 16px;
      }

      .charge-btn {
        font-size: 13px;
        padding: 10px;
      }

      .modal {
        width: calc(100% - 28px);
      }
    }
  </style>
</head>
<body>

<div class="pos">
  <div class="left">
    <div class="topbar">
      <div class="logo">CRAZY <span>MOON</span></div>
      <div id="tab-list" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
      <button class="new-tab-btn" onclick="openTableModal()">+ Mesa</button>
    </div>
    <div class="cat-bar" id="cat-bar"></div>
    <div class="sampler-note">Sampler 4 estilos · <span>$160 · 150ml c/u</span></div>
    <div class="menu-grid" id="menu-grid"></div>
  </div>

  <div class="right">
    <div class="order-header">
      <div class="order-title" id="order-title"></div>
      <div class="order-sub" id="order-sub"></div>
    </div>
    <div class="order-items" id="order-items">
      <div class="order-empty">Selecciona una mesa</div>
    </div>
    <div class="totals" id="totals" style="display:none;">
      <div class="totals-row grand"><span>TOTAL</span><span id="t-total">$0</span></div>
    </div>
    <div class="pay-section" id="pay-section" style="display:none;">
      <div class="pay-method">
        <button id="pay-cash" onclick="selectPay('cash')">Efectivo</button>
        <button id="pay-card" onclick="selectPay('card')">Tarjeta</button>
        <button id="pay-split" onclick="selectPay('split')">Mixto</button>
      </div>
      <div id="cash-input-row" class="cash-row" style="display:none;">
        <label>Recibido $</label>
        <input type="number" id="cash-tendered" placeholder="0" oninput="calcChange()" step="1" min="0">
        <span class="change-display" id="change-display"></span>
      </div>
      <button class="charge-btn" id="charge-btn" onclick="chargeOrder()" disabled>Cobrar</button>
      <button class="clear-btn" onclick="clearOrder()">Limpiar orden</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="table-modal" style="display:none;">
  <div class="modal">
    <h2>Selecciona una mesa</h2>
    <div class="table-grid" id="table-grid"></div>
    <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<div class="modal-overlay" id="size-modal" style="display:none;">
  <div class="modal">
    <h2 id="size-modal-name"></h2>
    <p style="font-size:12px;color:var(--text-mid);margin-bottom:14px;">Selecciona el tamaño</p>
    <div class="size-modal-btns">
      <button class="size-btn-sm" id="size-300-btn" onclick="confirmSize(300)"></button>
      <button class="size-btn-lg" id="size-500-btn" onclick="confirmSize(500)"></button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="note-modal" style="display:none;">
  <div class="modal">
    <h2>Modificar</h2>
    <textarea id="note-input" class="note-input" placeholder="Ej: sin mayonesa, término medio..."></textarea>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="size-btn-sm" onclick="cancelNote()">Sin modificación</button>
      <button class="size-btn-lg" onclick="confirmNote()">Agregar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="spinner-overlay" id="spinner"><div class="spinner"></div></div>

<script>

const BASE = 'https://crazymoon.space/crazymoon_pos/api';
const API = {
  menu:   BASE + '/menu.php',
  tables: BASE + '/tables.php',
  orders: BASE + '/orders.php',
  auth:   BASE + '/auth.php',
};

const CATS = ['Tap Pintas','Latas','Pizzas','Burgers','Botanas','Postres','Bebidas'];
const fmt = n => '$' + Math.round(n).toLocaleString();

async function init() {
  await Promise.all([loadMenu(), loadTables()]);
  renderCats();
  renderMenu();
  renderTabs();
}

async function loadMenu() {
  try {
    const res = await fetch(API.menu);
    const data = await res.json();
    menuItems = data.items || [];
  } catch(e) { toast('Error cargando menu'); }
}

async function loadTables() {
  try {
    const res = await fetch(API.tables);
    const data = await res.json();
    tables = data.tables || [];

    for (const t of tables) {
      if (t.order_id) {
        await loadOrderForTable(t.id, t.order_id);
      }
    }
  } catch(e) { toast('Error cargando mesas'); }
}

async function loadOrderForTable(table_id, order_id) {
  try {
    const res = await fetch(`${API.orders}?action=get_order&table_id=${table_id}`);
    const data = await res.json();
    if (data.order) {
      const items = data.items || [];
      items.forEach(i => {
        i.notes = i.notes || '';
        i._key = `${i.menu_item_id || i.item_name}-${i.size || ''}-${i.notes || ''}`;
      });

      activeTabs[table_id] = {
        order_id: data.order.id,
        items: items,
        total: parseFloat(data.order.total || 0),
      };
    }
  } catch(e) {}
}

init();
</script>

    try {

        console.log("PRINTERS:", printers);

    } catch (err) {
